server:
  port: 8080
  
spring:
  application:
    name: movie_catalog
    
  liquibase:
#    change-log:
    enabled: false
   
  datasource:
    hikari:
      driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/movie_catalog
    username: 
    password: 
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        
logging:
  file:
    name: logs/movie_catalog
  
